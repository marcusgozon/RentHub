<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Log in - RentHub</title>
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="../css/pages.css" />
  <link rel="icon" type="image/png" href="../img/renthub_logo.png" />
</head>
<body data-root="../">
    <div class="page-loader" id="pageLoader" role="status" aria-label="Loading">
        <img src="../img/renthub_logo.png" alt="RentHub" class="loader-logo" />
    </div>

  <header class="site-header">
    <a href="../index.html" class="logo"><img src="../img/renthub_logo.png" alt="RentHub Logo" class="logoimg" /></a>
    <button class="menu-btn" id="menuBtn" aria-label="Toggle menu"><span></span><span></span><span></span></button>
    <nav id="nav">
      <ul class="nav-links">
        <li><a href="../index.html">Home</a></li>
        <li><a href="browse.html">Browse</a></li>
        <li><a href="myrentals.html">My Rentals</a></li>
        <li><a href="extendstay.html">Extend Stay</a></li>
      </ul>
    </nav>
    <div class="auth" id="auth">
      <a href="login.html"><button class="btn-primary">Log In</button></a>
      <a href="signup.html" class="signup"><button class="btn-primary">Sign Up</button></a>
    </div>
  </header>

  <main class="form-wrap">
    <div class="search-card">
      <h1>Welcome back</h1>
      <form id="f">
        <label for="email">EMAIL</label><input id="email" type="email" required autocomplete="email" />
        <label for="pw">PASSWORD</label><input id="pw" type="password" required autocomplete="current-password" />
        <p class="error" id="err"></p>
        <button class="btn-primary" type="submit">Log In</button>
      </form>
      <form id="f2" hidden>
        <p class="sub" id="codeInfo"></p>
        <label for="code">6-DIGIT CODE</label>
        <input id="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" required />
        <p class="error" id="err2"></p>
        <button class="btn-primary" type="submit">Verify and log in</button>
        <p class="alt"><a href="#" id="resend">Resend code</a> &middot; <a href="login.html">Start over</a></p>
      </form>
      <p class="alt" id="newHere">New here? <a href="signup.html">Create an account</a></p>
    </div>
  </main>
  <footer class="site-footer"><p>&copy; 2024 RentHub. All rights reserved.</p></footer>
  <script src="../js/script.js"></script>
  <script>
    const $ = id => document.getElementById(id);
    const goNext = () => location.href = new URLSearchParams(location.search).get("next") || "../index.html";

    // Step 1: email + password
    $("f").addEventListener("submit", async e => {
      e.preventDefault();
      $("err").textContent = "";
      const res = await RH.login($("email").value, $("pw").value);
      if (res.error) { $("err").textContent = res.error; return; }
      if (res.requires2fa) {
        // Swap to the code step
        $("f").hidden = true; $("newHere").hidden = true; $("f2").hidden = false;
        document.querySelector(".search-card h1").textContent = "Check your email";
        $("codeInfo").textContent = "We sent a 6-digit code to " + res.emailHint + ". It expires in 10 minutes.";
        $("code").focus();
        return;
      }
      goNext();
    });

    // Step 2: the emailed code
    $("f2").addEventListener("submit", async e => {
      e.preventDefault();
      $("err2").textContent = "";
      const res = await RH.verify2fa($("code").value);
      if (res.error) { $("err2").textContent = res.error; return; }
      goNext();
    });

    $("resend").addEventListener("click", async e => {
      e.preventDefault();
      $("err2").textContent = "";
      const res = await RH.resend2fa();
      $("err2").textContent = res.error || res.message;
    });
  </script>
</body>
</html>
