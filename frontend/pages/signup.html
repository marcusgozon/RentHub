<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign up - RentHub</title>
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/pages.css" />
    <link rel="icon" type="image/png" href="../img/renthub_logo.png" />
  </head>
  <body data-root="../">
    <div class="page-loader" id="pageLoader" role="status" aria-label="Loading">
        <img src="../img/renthub_logo.png" alt="RentHub" class="loader-logo" />
    </div>

    <header class="site-header">
      <a href="../index.html" class="logo"
        ><img
          src="../img/renthub_logo.png"
          alt="RentHub Logo"
          class="logoimg"
      /></a>
      <button class="menu-btn" id="menuBtn" aria-label="Toggle menu"><span></span><span></span><span></span></button>
      <nav id="nav">
        <ul class="nav-links">
          <li><a href="../index.html">Home</a></li>
          <li><a href="browse.html">Browse</a></li>
          <li><a href="myrentals.html">My Rentals</a></li>
          <li><a href="extendstay.html">Extend Stay</a></li>
        </ul>
      </nav>
      <div class="auth" id="auth">
        <a href="login.html"><button class="btn-primary">Log In</button></a>
        <a href="signup.html" class="signup"
          ><button class="btn-primary">Sign Up</button></a
        >
      </div>
    </header>

    <main class="form-wrap">
      <div class="search-card">
        <h1>Create your account</h1>
        <form id="f" novalidate>
          <label for="name">FULL NAME</label
          ><input id="name" required autocomplete="name" />
          <label for="email">EMAIL</label>
          <div class="inline-row">
            <input id="email" type="email" required autocomplete="email" />
            <button class="btn-secondary" type="button" id="sendBtn">Send code</button>
          </div>
          <label for="role">ACCOUNT TYPE</label
          ><select id="role" required>
            <option value="tenant">Tenant</option>
            <option value="landlord">Landlord</option>
          </select>
          <label for="pw">PASSWORD</label
          ><input
            id="pw"
            type="password"
            minlength="8"
            required
            autocomplete="new-password"
          />
          <label for="pw2">CONFIRM PASSWORD</label
          ><input
            id="pw2"
            type="password"
            required
            autocomplete="new-password"
          />

          <label for="code">6-DIGIT VERIFICATION CODE</label>
          <input
            id="code"
            class="code-input"
            inputmode="numeric"
            pattern="[0-9]{6}"
            maxlength="6"
            placeholder="______"
            autocomplete="one-time-code"
            disabled
          />
          <p class="sub" id="codeInfo">
            Fill in your details, then press <b>Send code</b>. We'll email you a
            6-digit code to confirm your email address.
          </p>
          <p class="alt left" id="codeLinks" hidden>
            <a href="#" id="editLink">Edit details</a>
          </p>

          <p class="error" id="err"></p>
          <button class="btn-primary" type="submit" id="signupBtn" disabled>Sign Up</button>
        </form>
        <p class="alt" id="haveAcct">
          Already have an account? <a href="login.html">Log in</a>
        </p>
      </div>
    </main>
    <footer class="site-footer">
      <p>&copy; 2024 RentHub. All rights reserved.</p>
    </footer>
    <script src="../js/script.js"></script>
    <script>
      const $ = (id) => document.getElementById(id);
      const TAKEN_MSG = "That email already has an account. Try logging in.";
      const FIELDS = ["name", "email", "role", "pw", "pw2"];
      const COOLDOWN = 30; // seconds, matches the server
      let codeSent = false;
      let timer = null;

      const goNext = () =>
        (location.href = new URLSearchParams(location.search).get("next") || "browse.html");

      function setLocked(locked) {
        FIELDS.forEach((id) => {
          $(id).disabled = locked;
        });
      }

      function startCooldown() {
        let left = COOLDOWN;
        clearInterval(timer);
        $("sendBtn").disabled = true;
        const tick = () => {
          if (left <= 0) {
            clearInterval(timer);
            $("sendBtn").disabled = false;
            $("sendBtn").textContent = "Resend code";
            return;
          }
          $("sendBtn").textContent = "Resend in " + left + "s";
          left--;
        };
        tick();
        timer = setInterval(tick, 1000);
      }

      // Warn as soon as the user leaves the email field.
      $("email").addEventListener("blur", async () => {
        const el = $("email");
        if (codeSent || !el.value || !el.checkValidity()) return;
        if (await RH.emailTaken(el.value)) {
          $("err").textContent = TAKEN_MSG;
          $("sendBtn").disabled = true;
        }
      });
      $("email").addEventListener("input", () => {
        if (!codeSent && $("sendBtn").disabled) {
          $("err").textContent = "";
          $("sendBtn").disabled = false;
        }
      });

      function validateDetails() {
        if (!$("name").value.trim()) return "Enter your full name.";
        if (!$("email").value.trim() || !$("email").checkValidity()) return "Enter a valid email address.";
        if ($("pw").value.length < 8) return "Password must be at least 8 characters.";
        if ($("pw").value !== $("pw2").value) return "Passwords don't match.";
        return "";
      }

      // Step 1: "Send code" (or "Resend code") emails a 6-digit code. No account yet.
      $("sendBtn").addEventListener("click", async () => {
        $("err").textContent = "";
        const problem = validateDetails();
        if (problem) {
          $("err").textContent = problem;
          return;
        }
        $("sendBtn").disabled = true;
        $("sendBtn").textContent = "Sending...";
        const res = codeSent
          ? await RH.resendSignup()
          : await RH.signup($("name").value, $("email").value, $("pw").value, $("role").value);
        if (res.error) {
          $("err").textContent = res.error;
          $("sendBtn").disabled = false;
          $("sendBtn").textContent = codeSent ? "Resend code" : "Send code";
          return;
        }
        const first = !codeSent;
        codeSent = true;
        setLocked(true);
        $("code").disabled = false;
        $("signupBtn").disabled = false;
        $("codeLinks").hidden = false;
        $("haveAcct").hidden = true;
        $("codeInfo").textContent = first
          ? "We sent a 6-digit code to " + (res.emailHint || "your email") + ". It expires in 10 minutes."
          : "A new code was sent. The old one no longer works.";
        $("code").focus();
        startCooldown();
      });

      // Let the user go back and change their details (then send a fresh code).
      $("editLink").addEventListener("click", (e) => {
        e.preventDefault();
        clearInterval(timer);
        codeSent = false;
        setLocked(false);
        $("code").value = "";
        $("code").disabled = true;
        $("signupBtn").disabled = true;
        $("codeLinks").hidden = true;
        $("haveAcct").hidden = false;
        $("sendBtn").disabled = false;
        $("sendBtn").textContent = "Send code";
        $("err").textContent = "";
        $("codeInfo").textContent =
          "Fill in your details, then press Send code. We'll email you a 6-digit code to confirm your email address.";
      });

      // Digits only
      $("code").addEventListener("input", () => {
        $("code").value = $("code").value.replace(/\D/g, "").slice(0, 6);
      });

      // Step 2: Sign Up only works with the correct emailed code.
      $("f").addEventListener("submit", async (e) => {
        e.preventDefault();
        $("err").textContent = "";
        if (!codeSent) {
          $("err").textContent = "Press Send code first to verify your email.";
          return;
        }
        if ($("code").value.length !== 6) {
          $("err").textContent = "Enter the 6-digit code from your email.";
          $("code").focus();
          return;
        }
        $("signupBtn").disabled = true;
        const res = await RH.verifySignup($("code").value);
        $("signupBtn").disabled = false;
        if (res.error) {
          $("err").textContent = res.error;
          return;
        }
        goNext();
      });
    </script>
  </body>
</html>
